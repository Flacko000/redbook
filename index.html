<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RedBook">
<meta name="theme-color" content="#0e1014">
<meta name="robots" content="noindex, nofollow">
<title>RedBook</title>
<style>
:root{--bg:#0e1014;--p:#171a21;--p2:#1f232c;--ln:#2a2f3a;--tx:#eceef2;--mu:#99a0ad;--acc:#e5383b;--acc2:#5fb3d9;--ok:#6cc58a;--ko:#e2725b;--nav:64px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
a{color:var(--acc2)}
button{font:inherit;color:inherit}
.view{display:none;padding:calc(var(--st) + 12px) 14px calc(var(--nav) + var(--sb) + 24px);max-width:1000px;margin:0 auto}
.view.on{display:block}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.4px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu)}.sm{font-size:12.5px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.wrapr{flex-wrap:wrap}
.sp{flex:1}
.btn{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.on{background:var(--acc2);border-color:var(--acc2);color:#04131b;font-weight:600}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5}
input[type=search],input[type=text],select{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc2)}
.seg{display:flex;background:var(--p2);border:1px solid var(--ln);border-radius:11px;padding:3px;gap:3px;margin:8px 0 12px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:8px 6px;font-size:14px;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
/* nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(18,20,26,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--ln);display:flex;padding-bottom:var(--sb)}
nav.bar button{flex:1;background:none;border:0;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:11.5px;cursor:pointer}
nav.bar button svg{width:24px;height:24px}
nav.bar button.on{color:var(--acc)}
/* carousels */
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.tile{flex:0 0 112px;scroll-snap-align:start;cursor:pointer;position:relative}
.tile .po{width:112px;height:168px;border-radius:10px;background:var(--p2) center/cover no-repeat;border:1px solid var(--ln);display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:var(--mu);text-align:center;padding:6px;overflow:hidden}
.tile .tt{font-size:12.5px;margin-top:5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .yy{font-size:11.5px;color:var(--mu)}
.badge{position:absolute;top:6px;right:6px;border-radius:7px;padding:1px 6px;font-size:12px;font-weight:700;color:#111}
.badge.wl{background:var(--acc2);left:6px;right:auto;font-size:11px}
.secnote{font-size:12.5px;color:var(--mu);margin:-6px 0 8px}
/* list */
.li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);cursor:pointer;align-items:center}
.li .po{flex:0 0 46px;height:69px;border-radius:7px;background:var(--p2) center/cover no-repeat;border:1px solid var(--ln)}
.li .po.round{border-radius:50%;height:46px}
.li .bd{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{display:inline-block;min-width:30px;text-align:center;border-radius:7px;padding:2px 6px;font-weight:700;color:#111;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.grid3 .tile{flex:none}
.grid3 .tile .po{width:100%;height:auto;aspect-ratio:2/3}
.empty{color:var(--mu);text-align:center;padding:22px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--p2);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.chip.off{background:#3a1f1a;border-color:#7a3a2e;color:#f3b3a6;text-decoration:line-through}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--ln);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:168px;border-radius:10px;background:linear-gradient(90deg,var(--p2),#262b36,var(--p2));background-size:200% 100%;animation:sk 1.2s infinite;flex:0 0 112px}
@keyframes sk{to{background-position:-200% 0}}
/* overlay (dettaglio) */
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none}
.ov.on{display:block}
.ovtop{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;padding:calc(var(--st) + 8px) 12px 8px;background:linear-gradient(var(--bg) 60%,rgba(14,16,20,0))}
.ovtop .btn{background:rgba(31,35,44,.9)}
.ovb{max-width:900px;margin:0 auto;padding:0 14px calc(40px + var(--sb))}
.hero{position:relative;margin:-56px -14px 0;height:230px;background:var(--p2) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(14,16,20,.2),var(--bg))}
.dhead{display:flex;gap:14px;margin-top:-90px;position:relative;z-index:2}
.dhead .po{flex:0 0 108px;height:162px;border-radius:10px;background:var(--p2) center/cover;border:1px solid var(--ln)}
.dhead .ti{align-self:flex-end;min-width:0}
.dhead h1{font-size:22px}
.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.scores{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px}
.sc .v{font-size:22px;font-weight:700}
.sc .l{font-size:12px;color:var(--mu)}
.sc.big{grid-column:span 1;border-color:#5a2326;background:#231214}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv div:nth-child(odd){color:var(--mu)}
.lnk{color:var(--acc2);cursor:pointer}
.cast{flex:0 0 92px;cursor:pointer}
.cast .ph{width:92px;height:118px;border-radius:10px;background:var(--p2) center/cover;border:1px solid var(--ln)}
.cast .n{font-size:12.5px;margin-top:4px;line-height:1.2}
.cast .c{font-size:11.5px;color:var(--mu);line-height:1.2}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.rate button{border:1px solid var(--ln);background:var(--p2);border-radius:8px;padding:9px 0;font-weight:700;cursor:pointer;font-size:14px}
.my{border-color:#3b4a5a}
/* filtri: bottom sheet */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:none}
.sheetbg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--p);border-radius:18px 18px 0 0;border-top:1px solid var(--ln);max-height:86vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet .sh{padding:10px 14px;border-bottom:1px solid var(--ln);display:flex;gap:8px;align-items:center}
.sheet .grab{width:40px;height:4px;background:var(--ln);border-radius:4px;margin:8px auto 0}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 14px calc(18px + var(--sb));flex:1}
.acc{border:1px solid var(--ln);border-radius:12px;margin:8px 0;background:var(--p2)}
.acc>.ah{display:flex;align-items:center;gap:8px;padding:12px;cursor:pointer;user-select:none}
.acc>.ah .ar{transition:transform .2s;color:var(--mu)}
.acc.open>.ah .ar{transform:rotate(90deg)}
.acc>.ab{display:none;padding:0 12px 12px}
.acc.open>.ab{display:block}
.acc .val{font-size:12.5px;color:var(--acc);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eye{background:none;border:0;color:var(--mu);font-size:13px;padding:4px 6px;cursor:pointer}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;accent-color:var(--acc)}
.range b{min-width:40px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.factive{font-size:12.5px;color:var(--mu)}
.factive b{color:var(--acc)}
/* analisi */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px}
.kpi .v{font-size:24px;font-weight:700}
.kpi .l{font-size:12px;color:var(--mu)}
.box{background:var(--p);border:1px solid var(--ln);border-radius:14px;margin:12px 0}
.box>.bh{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none}
.box>.bh h3{margin:0;flex:1}
.box>.bh .ar{color:var(--mu);transition:transform .2s}
.box.open>.bh .ar{transform:rotate(90deg)}
.box>.bb{display:none;padding:0 14px 14px}
.box.open>.bb{display:block}
.hb{display:grid;grid-template-columns:minmax(90px,36%) 1fr auto;gap:6px 8px;align-items:center;font-size:13.5px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hb .tr{background:var(--p2);border-radius:6px;height:16px;position:relative;overflow:hidden}
.hb .fl{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.hb .vl{font-variant-numeric:tabular-nums;color:var(--mu);font-size:12.5px;min-width:66px;text-align:right}
.cols{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;cursor:pointer}
.col .b{width:100%;border-radius:5px 5px 0 0;position:relative;min-height:2px}
.col .b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mu);white-space:nowrap}
.col .x{font-size:11px;color:var(--mu);margin-top:4px;white-space:nowrap}
.ins{margin:0;padding-left:18px}.ins li{margin:6px 0}.ins b{color:var(--acc)}
.hm{overflow-x:auto}
.hm table{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:520px}
.hm td,.hm th{text-align:center;padding:6px 4px;border-radius:6px}
.hm th{color:var(--mu);font-weight:500}.hm td.g{text-align:left;white-space:nowrap}
/* confronta */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--p);border:1px dashed var(--ln);border-radius:14px;padding:10px;min-height:120px;position:relative}
.slot.full{border-style:solid}
.slot .po{width:100%;aspect-ratio:2/3;border-radius:10px;background:var(--p2) center/cover;max-height:220px}
.dd{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--p);border:1px solid var(--ln);border-radius:12px;max-height:300px;overflow:auto;margin-top:4px;padding:0 10px}
.ct{width:100%;border-collapse:collapse;font-size:13.5px}
.ct td{padding:9px 6px;border-bottom:1px solid var(--ln);vertical-align:top;width:40%}
.ct td.k{width:20%;color:var(--mu);font-size:12px;text-align:center}
.ct td.w{color:var(--ok);font-weight:700}
.ct td:last-child{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sb) + 14px);transform:translateX(-50%);background:#2b3240;border:1px solid var(--ln);border-radius:12px;padding:10px 14px;z-index:90;font-size:14px;display:none;max-width:90vw}
.toast.on{display:block}
textarea{width:100%;min-height:90px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;font-size:12px}
.prog{height:6px;background:var(--p2);border-radius:6px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--acc2);width:0}
.po span{font-size:11px;color:var(--mu);text-align:center;padding:4px}.po.has span{display:none}.li .po span{display:none}
details summary{cursor:pointer;margin:4px 0}
.acc .pm::before{content:"+";font-size:24px;line-height:1;color:var(--acc);font-weight:700;width:24px;text-align:center;display:inline-block}.acc.open .pm::before{content:"−"}
input[type=number]{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;outline:none}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
</style>
</head>
<body>

<section class="view on" id="v-home"></section>

<section class="view" id="v-search">
  <div class="seg" id="srchSeg"><button data-m="film" class="on">Cerca film</button><button data-m="person">Attore / regista</button><button data-m="cmp">Confronta</button></div>
  <div id="filmPane"></div><div id="personPane" style="display:none"></div><div id="cmpPane" style="display:none"></div>
</section>

<section class="view" id="v-prof">
  <div id="profHead"></div>
  <div class="seg" id="profSeg"><button data-p="seen" class="on">Visti</button><button data-p="wl">Watchlist</button><button data-p="stats">Analisi</button><button data-p="set">⚙︎</button></div>
  <div id="profBody"></div>
</section>

<nav class="bar" id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-v="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Cerca</button>
  <button data-v="prof"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profilo</button>
</nav>

<div class="ov" id="ov"><div class="ovtop"><button class="btn" id="ovBack">‹ Indietro</button><button class="btn" id="ovFwd" disabled>Avanti ›</button><span class="sp"></span><button class="btn" id="ovClose">✕</button></div><div class="ovb" id="ovBody"></div></div>
<div class="sheetbg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="sh"><b style="flex:1">Filtri</b><button class="btn sm" id="fCustom">Personalizza</button><button class="btn sm" id="fReset">Azzera</button><button class="btn sm pri" id="fDone">Fatto</button></div><div class="sb" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="pickCsv" accept=".csv,text/csv,text/plain" style="display:none">
<input type="file" id="pickBk" accept=".json,application/json,text/plain" style="display:none">

const cache = new Map();
function limiter(n){ let a=0; const q=[]; return fn => new Promise((res,rej)=>{ const run=()=>{ a++; fn().then(res,rej).finally(()=>{ a--; const x=q.shift(); if(x) x(); }); }; if(a<n) run(); else q.push(run); }); }
const limS = limiter(3), limW = limiter(5);
async function getJSON(url, lim, tries=2){
  if (cache.has(url)) return cache.get(url);
  const p = lim(async()=>{ for (let i=0;;i++){ try{ const r=await fetch(url); if (r.status===429 && i<tries){ await new Promise(z=>setTimeout(z,1500*(i+1))); continue; } if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); } catch(e){ if(i>=tries) throw e; await new Promise(z=>setTimeout(z,800)); } } });
  cache.set(url,p); p.catch(()=>cache.delete(url)); return p;
}
async function sparql(q){
  const j = await getJSON("https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(q), limS);
  return j.results.bindings.map(b => { const o={}; for (const k in b) o[k]=b[k].value; return o; });
}
const wd = params => getJSON("https://www.wikidata.org/w/api.php?format=json&origin=*&"+new URLSearchParams(params), limW);
const wp = (lang, params) => getJSON(`https://${lang}.wikipedia.org/w/api.php?format=json&origin=*&`+new URLSearchParams(params), limW);

// righe "film" comuni a tutte le query di elenco
const FILMCOLS = `?f ?fLabel ?imdb ?en ?sl (MIN(YEAR(?d)) AS ?y)`;
const FILMOPT = `OPTIONAL{?f wdt:P345 ?imdb} OPTIONAL{?f wdt:P577 ?d} OPTIONAL{?f wikibase:sitelinks ?sl} OPTIONAL{?ae schema:about ?f; schema:isPartOf <https://en.wikipedia.org/>; schema:name ?en} SERVICE wikibase:label { bd:serviceParam wikibase:language "it,en". }`;
const FILMGRP = `GROUP BY ?f ?fLabel ?imdb ?en ?sl`;
const toFilm = b => ({q:qid(b.f), t:b.fLabel && !/^Q\d+$/.test(b.fLabel) ? b.fLabel : (b.en||b.fLabel), imdb:b.imdb||"", en:b.en||"", sl:+b.sl||0, y:+b.y||0});
const dedupe = a => [...new Map(a.map(x=>[x.q,x])).values()];
async function filmsByQ(qs){ // dettagli base di un elenco di QID, nell'ordine dato
  if (!qs.length) return [];
  const out = [];
  for (const c of chunk(qs, 80)) out.push(...(await sparql(`SELECT ${FILMCOLS} WHERE { VALUES ?f { ${c.map(q=>"wd:"+q).join(" ")} } ${FILMOPT} } ${FILMGRP}`)).map(toFilm));
  const m = new Map(dedupe(out).map(x=>[x.q,x])); return qs.map(q=>m.get(q)).filter(Boolean);
}
async function filmList(where, {order="DESC(?sl)", limit=40, offset=0, trueYear=false}={}){
  const base = `${where} ?f wdt:P31 ?ty . VALUES ?ty { ${FILMT} }`;
  const asc = order.startsWith("ASC");
  const inner = trueYear
    ? `SELECT ?f (MIN(?dd) AS ?k) WHERE { ${base} ?f wdt:P577 ?dd } GROUP BY ?f ORDER BY ${asc?"ASC":"DESC"}(?k) LIMIT ${limit} OFFSET ${offset}`
    : `SELECT DISTINCT ?f ?sl WHERE { ${base} ?f wikibase:sitelinks ?sl } ORDER BY DESC(?sl) LIMIT ${limit} OFFSET ${offset}`;
  const r = await sparql(`SELECT ${FILMCOLS} WHERE { { ${inner} } ${FILMOPT} } ${FILMGRP}`);
  const l = dedupe(r.map(toFilm));
  return /\?y/.test(order) ? l.sort((a,b)=>asc?(a.y||9999)-(b.y||9999):b.y-a.y) : l.sort((a,b)=>b.sl-a.sl);
}

async function metaByImdb(ids){
  const r = await sparql(`SELECT ?imdb ?f ?fLabel ?en ?it (MIN(YEAR(?d)) AS ?y) (GROUP_CONCAT(DISTINCT ?gl; separator="|") AS ?gs) (GROUP_CONCAT(DISTINCT ?dl; separator=" & ") AS ?ds) (GROUP_CONCAT(DISTINCT STRAFTER(STR(?c),"entity/"); separator="|") AS ?cs) WHERE {
    VALUES ?imdb { ${ids.map(sq).join(" ")} } ?f wdt:P345 ?imdb .
    OPTIONAL{?f wdt:P577 ?d} OPTIONAL{?f wdt:P495 ?c}
    OPTIONAL{?f wdt:P136 ?g . ?g rdfs:label ?gl FILTER(LANG(?gl)="it")}
    OPTIONAL{?f wdt:P57 ?di . ?di rdfs:label ?dl FILTER(LANG(?dl)="it")}
    OPTIONAL{?ae schema:about ?f; schema:isPartOf <https://en.wikipedia.org/>; schema:name ?en}
    OPTIONAL{?ai schema:about ?f; schema:isPartOf <https://it.wikipedia.org/>; schema:name ?it}
    SERVICE wikibase:label { bd:serviceParam wikibase:language "it,en". } } GROUP BY ?imdb ?f ?fLabel ?en ?it`);
  return r;
}
async function metaByQ(qs){
  const r = await sparql(`SELECT ?f ?fLabel ?imdb ?en ?it (MIN(YEAR(?d)) AS ?y) (GROUP_CONCAT(DISTINCT ?gl; separator="|") AS ?gs) (GROUP_CONCAT(DISTINCT ?dl; separator=" & ") AS ?ds) (GROUP_CONCAT(DISTINCT STRAFTER(STR(?c),"entity/"); separator="|") AS ?cs) WHERE {
    VALUES ?f { ${qs.map(q=>"wd:"+q).join(" ")} } OPTIONAL{?f wdt:P345 ?imdb} OPTIONAL{?f wdt:P577 ?d} OPTIONAL{?f wdt:P495 ?c}
    OPTIONAL{?f wdt:P136 ?g . ?g rdfs:label ?gl FILTER(LANG(?gl)="it")}
    OPTIONAL{?f wdt:P57 ?di . ?di rdfs:label ?dl FILTER(LANG(?dl)="it")}
    OPTIONAL{?ae schema:about ?f; schema:isPartOf <https://en.wikipedia.org/>; schema:name ?en}
    OPTIONAL{?ai schema:about ?f; schema:isPartOf <https://it.wikipedia.org/>; schema:name ?it}
    SERVICE wikibase:label { bd:serviceParam wikibase:language "it,en". } } GROUP BY ?f ?fLabel ?imdb ?en ?it`);
  return r;
}
const metaToRec = b => ({q:qid(b.f), imdb:b.imdb||"", t:(b.fLabel&&!/^Q\d+$/.test(b.fLabel))?b.fLabel:(b.it||b.en||""), y:+b.y||0, g:genresFromLabels(b.gs), d:(b.ds||"").split(" & ").slice(0,2).join(" & "), c:(b.cs||"").split("|").map(q=>QCTY[q]||"").find(Boolean)||"", en:b.en||"", it:b.it||""});

let pend = new Set(), pT, savePT;
function needPoster(t){ if (!t || t in posters) return; pend.add(t); clearTimeout(pT); pT=setTimeout(flushPosters, 120); }
async function flushPosters(){
  const all=[...pend]; pend.clear();
  for (const c of chunk(all, 50)) {
    try{
      const j = await wp("en", {action:"query", prop:"pageimages", piprop:"thumbnail", pithumbsize:"342", pilicense:"any", redirects:"1", titles:c.join("|")});
      const back = {}; (j.query?.normalized||[]).forEach(n=>back[n.to]=(back[n.to]||[]).concat(n.from));
      (j.query?.redirects||[]).forEach(n=>{ const fr=[n.from, ...(back[n.from]||[])]; back[n.to]=(back[n.to]||[]).concat(fr); });
      const pages = Object.values(j.query?.pages||{});
      c.forEach(t=>{ if(!(t in posters)) posters[t]=""; });
      pages.forEach(p=>{ const u=p.thumbnail?.source||""; [p.title, ...(back[p.title]||[])].forEach(t=>posters[t]=u); });
      applyPosters(c);
    }catch(e){ /* riprova più tardi */ }
  }
  clearTimeout(savePT); savePT=setTimeout(()=>LS.set("posters",posters),1000);
}
function applyPosters(titles){
  const set = new Set(titles);
  document.querySelectorAll(".po[data-en]").forEach(el=>{ const t=el.dataset.en; if(!set.has(t)) return; const u=posters[t]; if(u){ el.style.backgroundImage=`url("${u}")`; el.classList.add("has"); } });
}
const io = ("IntersectionObserver" in window) ? new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; io.unobserve(e.target); const t=e.target.dataset.en; if(t in posters){ applyPosters([t]); } else needPoster(t); }),{rootMargin:"400px"}) : null;
function hydrate(root){ (root||document).querySelectorAll(".po[data-en]:not(.has)").forEach(el=>{ const t=el.dataset.en; if(posters[t]){ el.style.backgroundImage=`url("${posters[t]}")`; el.classList.add("has"); } else if (!(t in posters)) { io?io.observe(el):needPoster(t); } }); }
const lazy = hydrate;
const poAttr = en => en ? `data-en="${esc(en)}"${posters[en]?` style="background-image:url(&quot;${esc(posters[en])}&quot;)"`:""}` : "";

/* ---------- collegamento dei tuoi film a Wikidata ---------- */
let syncing=false;
async function syncAll(){
  if (syncing) return; syncing=true;
  const todo = Object.values(films).filter(f=>f.imdb && !(f.k in wmap));
  const el = () => $("syncProg");
  let done=0;
  const tick = () => { const e=el(); if(e) e.innerHTML = todo.length && done<todo.length ? `Collego i tuoi film a Wikipedia: ${done}/${todo.length}<div class="prog"><i style="width:${done/todo.length*100}%"></i></div>` : ""; };
  tick();
  for (const c of chunk(todo, 100)) {
    try {
      const r = await metaByImdb(c.map(f=>f.imdb));
      const by = {}; r.forEach(b=>{ if(!by[b.imdb]) by[b.imdb]=b; });
      c.forEach(f=>{ const b=by[f.imdb]; if(!b){ wmap[f.k]=0; return; } const m=metaToRec(b); wmap[f.k]={q:m.q,en:m.en,it:m.it};
        if(!f.g?.length) f.g=m.g; if(!f.d) f.d=m.d; if(!f.c) f.c=m.c; if(!f.y) f.y=m.y; });
    } catch(e) { break; }
    done += c.length; tick();
    LS.set("wmap", wmap);
  }
  saveFilms(); rebuildQM(); syncing=false; tick();
  hydrate(document);
  if (todo.length) { if(cur==="prof") renderProfile(); }
}

function pickCsv(kind){ $("pickCsv").dataset.kind=kind; $("pickCsv").click(); }
function parseCSV(t){
  const rows=[]; let row=[], v="", q=false;
  for (let i=0;i<t.length;i++){ const c=t[i];
    if (q) { if (c==='"') { if (t[i+1]==='"'){v+='"';i++;} else q=false; } else v+=c; }
    else if (c==='"') q=true; else if (c===',') {row.push(v);v="";} else if (c==='\n'||c==='\r') { if(c==='\r'&&t[i+1]==='\n') i++; row.push(v); rows.push(row); row=[]; v=""; } else v+=c; }
  if (v||row.length) { row.push(v); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
function importCSV(txt, kind){
  const rows=parseCSV(txt.replace(/^﻿/,"")); if(rows.length<2) return {err:"File vuoto o non riconosciuto"};
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const ci = n => h.findIndex(x=>n.includes(x));
  const iI=ci(["imdbid","imdb id","const"]), iT=ci(["title","titolo","name"]), iY=ci(["year","anno"]), iR=ci(["rating10","rating","voto"]), iD=ci(["watcheddate","date","data"]);
  if (iT<0) return {err:"Colonna del titolo non trovata"};
  let add=0, upd=0;
  rows.slice(1).forEach(r=>{
    const imdb=(iI>=0?r[iI]:"").trim(), t=(r[iT]||"").trim(), y=+(r[iY]||0); if(!t) return;
    let k = imdb || ("x:"+norm(t)+"|"+y);
    let ex = films[k];
    if (ex && imdb && (ex.y && y && Math.abs(ex.y-y)>1)) { k = "x:"+norm(t)+"|"+y; ex = films[k]; }  // stesso codice IMDb ma film diverso
    if (!ex) ex = Object.values(films).find(f=>norm(f.t)===norm(t)&&f.y===y);
    let rv = iR>=0 ? parseFloat(r[iR]) : NaN; if (rv && rv<=5 && h[iR]==="rating") rv=Math.round(rv*2);
    if (ex) { if (kind==="w" && rv) { ex.r=Math.round(rv); if(ex.st!=="w"){ex.st="w"; ex.dt=(iD>=0&&r[iD])||today();} upd++; } return; }

async function unlock(btn){
  const card=btn.closest(".card"), pin=card.querySelector("input").value.trim().toLowerCase(), msg=card.querySelector(".pmsg");
  if(!(window.crypto&&crypto.subtle)){ msg.textContent="Apri l'app dal suo indirizzo web (https), non dall'anteprima del file."; return; }
  btn.disabled=true; msg.textContent="";
  try{
    const raw=Uint8Array.from(atob(ENC),c=>c.charCodeAt(0));
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:raw.slice(0,16),iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(16,28)},key,raw.slice(28))));
    films=d.films; saveFilms(); rebuildQM(); resetSF(); homeDirty=true; toast("Film sbloccati: "+Object.keys(films).length); renderHome(); if(cur==="prof") renderProfile();

const stack=[], fwd=[]; let ovGen=0;
const keepY = () => { const t=stack[stack.length-1]; if(t) t._y=$("ov").scrollTop; };
function pushOv(fn){ keepY(); stack.push(fn); fwd.length=0; showOv(); }
function reShow(){ keepY(); showOv(true); }
function showOv(restore){ ovGen++; const fn=stack[stack.length-1]; $("ovFwd").disabled=!fwd.length; if(!fn){ $("ov").classList.remove("on"); document.body.classList.remove("lock"); return; } $("ov").classList.add("on"); document.body.classList.add("lock"); $("ov").scrollTop=0; const g=ovGen; Promise.resolve(fn()).then(()=>{ if(restore && g===ovGen && fn._y) $("ov").scrollTop=fn._y; }); }
$("ovBack").onclick = () => { keepY(); const f=stack.pop(); if(f) fwd.push(f); showOv(true); if(!stack.length) refreshCurrent(); };
$("ovFwd").onclick = () => { const f=fwd.pop(); if(!f) return; keepY(); stack.push(f); showOv(true); };
$("ovClose").onclick = () => { stack.length=0; fwd.length=0; showOv(); refreshCurrent(); };
function refreshCurrent(){ if(cur==="prof") renderProfile(); if(cur==="search" && sMode==="film" && $("fL")) runFilmSearch(); homeDirty=true; if(cur==="home") renderHome(); }

}

async function labelsAndImages(qs){
  const out={};

function section(text, names){

    const m = re.exec("\n"+text); if (m) return m[1].replace(/\n===?[^=\n]+===?\n/g,"\n").trim();

  const vals = () => { const s={year:(SQ.y1||SQ.y2)?`${SQ.y1||"…"}–${SQ.y2||"…"}`:"", gen:[...SQ.gen].map(g=>GEN[g]).join(", "), act:SQ.act.map(a=>a.l).join(", "), dir:SQ.dir.map(a=>a.l).join(", "), dur:SQ.dur?DUR[SQ.dur][0]:"", cty:SQ.cty?CTY[SQ.cty]:"", sort:{sl:"",new:"Più recenti",old:"Più vecchi"}[SQ.sort]+(SQ.hide?" · non visti":"")};

  let t0; $("fq").oninput = e => { SQ.q=e.target.value.trim(); clearTimeout(t0); t0=setTimeout(()=>runFilmSearch(), 450); };

let fPage=0, fRun=0;
async function runFilmSearch(more){
  const R=$("fRes"); if(!R) return; const run=++fRun;
  const any = SQ.q||SQ.y1||SQ.y2||SQ.gen.size||SQ.act.length||SQ.dir.length||SQ.dur||SQ.cty;
  if (!more) { fPage=0; R.innerHTML = `<div class="empty"><span class="spin"></span></div>`; } else fPage++;
  let mineHtml="";
  if (SQ.q) { const nq=norm(SQ.q); const mine=Object.values(films).filter(f=>norm(f.t).includes(nq)).slice(0,6); if(mine.length) mineHtml=`<h3 style="margin-top:14px">Nel tuo profilo</h3>`+mine.map(myRow).join(""); }
  try {
    let w="";
    if (SQ.q) { const j=await wd({action:"wbsearchentities", search:SQ.q, language:"it", uselang:"it", type:"item", limit:"50"}); const hits=(j.search||[]).map(s=>s.id);
      if (!hits.length) { if(run===fRun) R.innerHTML = mineHtml+`<div class="empty">Nessun film trovato. Prova con il titolo originale.</div>`; return; }
      w += `VALUES ?f { ${hits.map(h=>"wd:"+h).join(" ")} } `; }
    SQ.act.forEach(a=>w+=`?f wdt:P161 wd:${a.q} . `); SQ.dir.forEach(a=>w+=`?f wdt:P57 wd:${a.q} . `);
    SQ.gen.forEach(g=>w+=`?f wdt:P136 wd:${G2Q[g]} . `);
    if (SQ.cty) w+=`?f wdt:P495 wd:${CTYQ[SQ.cty]} . `;
    if (SQ.y1||SQ.y2) w+=`?f wdt:P577 ?d0 . FILTER(YEAR(?d0)>=${+SQ.y1||1880} && YEAR(?d0)<=${+SQ.y2||2100}) `;
    if (SQ.dur) w+=`?f wdt:P2047 ?rt . FILTER(?rt>=${DUR[SQ.dur][1]} && ?rt<${DUR[SQ.dur][2]}) `;
    if (SQ.sort==="new") w+=`?f wdt:P577 ?d1 . FILTER(?d1<=NOW()) `;
    if (!SQ.q && !SQ.act.length && !SQ.dir.length) w+=`?f wikibase:sitelinks ?sl0 . FILTER(?sl0>=${any?12:60}) `;
    let list = await filmList(w, SQ.sort==="sl" ? {limit:40, offset:fPage*40} : {limit:40, offset:fPage*40, trueYear:true, order:SQ.sort==="new"?"DESC(?y)":"ASC(?y)"});
    if (run!==fRun) return;
    const n=list.length; if (SQ.hide) list=notSeen(list);
    const html=list.map(m=>rowHTML(m)).join("");
    if (!more) R.innerHTML = mineHtml + `<h3 style="margin-top:16px">${any?"Risultati":"I film più famosi"}</h3><div id="fL">${html||'<div class="empty">Nessun film con questi criteri</div>'}</div>` + (n>=35&&!SQ.q?`<button class="btn" id="fMore" style="display:block;margin:12px auto">Carica altri</button>`:"");
    else { $("fL").insertAdjacentHTML("beforeend", html); if(n<35) $("fMore")?.remove(); }
    const mb=$("fMore"); if(mb) mb.onclick=()=>runFilmSearch(true);
    hydrate(R);
  } catch(e){ if(run===fRun) R.innerHTML = mineHtml + errBox(e); }
}

const cmp = {a:null, b:null};
function cmpHTML(A,B){
  const fA=recOf(A), fB=recOf(B);
  const castN = D => new Set(D.cast.map(c=>c.l));
  const shared = [...castN(A)].filter(n=>castN(B).has(n));
  const sharedG = A.genres.filter(g=>B.genres.includes(g));
  const nm = a => esc(a.map(d=>d.l).join(", ")||"–");
  const dt = D => D.date ? new Date(D.date).toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}) : "–";
  const rows = [
    ["Anno", A.y||"–", B.y||"–"], ["Uscita", dt(A), dt(B)],
    ["Regia", nm(A.dirs), nm(B.dirs)], ["Sceneggiatura", nm(A.writers), nm(B.writers)], ["Musiche", nm(A.music), nm(B.music)],
    ["Protagonisti", nm(A.cast.slice(0,4)), nm(B.cast.slice(0,4))],
    ["Paese", esc(A.countries.map(c=>CTY[c.c]||c.l).join(", ")||"–"), esc(B.countries.map(c=>CTY[c.c]||c.l).join(", ")||"–")],
    ["Lingua", esc(A.langs.join(", ")||"–"), esc(B.langs.join(", ")||"–")],
    ["Generi", esc(A.genres.slice(0,3).join(", ")||"–"), esc(B.genres.slice(0,3).join(", ")||"–")],
    ["Durata", A.runtime?Math.round(A.runtime)+" min":"–", B.runtime?Math.round(B.runtime)+" min":"–"],
    ["Critica /100", A.crit!=null?Math.round(A.crit):"–", B.crit!=null?Math.round(B.crit):"–", A.crit, B.crit, 1],
    ["Utenza /100", A.user!=null?Math.round(A.user):"–", B.user!=null?Math.round(B.user):"–", A.user, B.user, 1],
    ["Rotten Tomatoes", A.sc.rt!=null?A.sc.rt+"%":"–", B.sc.rt!=null?B.sc.rt+"%":"–", A.sc.rt, B.sc.rt, 1],
    ["RT pubblico", A.sc.rtA!=null?A.sc.rtA+"%":"–", B.sc.rtA!=null?B.sc.rtA+"%":"–", A.sc.rtA, B.sc.rtA, 1],
    ["Metacritic", A.sc.mc??"–", B.sc.mc??"–", A.sc.mc, B.sc.mc, 1],
    ["IMDb", A.sc.imdb!=null?fmt(A.sc.imdb):"–", B.sc.imdb!=null?fmt(B.sc.imdb):"–", A.sc.imdb, B.sc.imdb, 1],
    ["Oscar vinti", A.oscars, B.oscars, A.oscars, B.oscars, 1],
    ["Premi vinti", A.awards.length, B.awards.length, A.awards.length, B.awards.length, 1],
    ["Candidature", A.noms.length, B.noms.length, A.noms.length, B.noms.length, 1],
    ["Budget", money(A.budget)||"–", money(B.budget)||"–"],
    ["Incassi", money(A.box)||"–", money(B.box)||"–", A.box, B.box, 1],
    ["Fama (Wikipedia)", A.sl+" lingue", B.sl+" lingue", A.sl, B.sl, 1],
    ["Il tuo voto", fA?.st==="w"?fA.r:"–", fB?.st==="w"?fB.r:"–", fA?.st==="w"?fA.r:null, fB?.st==="w"?fB.r:null, 1]
  ];
  let wins=[0,0];
  const tr = rows.map(r=>{ let wa="",wb=""; if(r[5] && r[3]!=null && r[4]!=null && r[3]!==r[4]){ if(r[3]>r[4]){wa="w";wins[0]++;} else {wb="w";wins[1]++;} } return `<tr><td class="${wa}">${r[1]??"–"}</td><td class="k">${r[0]}</td><td class="${wb}">${r[2]??"–"}</td></tr>`; }).join("");
  return `<div class="card"><div class="row" style="text-align:center"><div class="sp"><b>${esc(A.t)}</b><div class="sm mu">vince ${wins[0]} voci</div></div><div class="mu">vs</div><div class="sp"><b>${esc(B.t)}</b><div class="sm mu">vince ${wins[1]} voci</div></div></div>
    <table class="ct" style="margin-top:8px">${tr}</table>
    <div class="sm" style="margin-top:10px">${sharedG.length?`Generi in comune: <b>${esc(sharedG.join(", "))}</b>. `:"Nessun genere in comune. "}${shared.length?`Attori in comune: <b>${esc(shared.join(", "))}</b>.`:""}</div></div>`;
}

function openCompare(a,b){ pushOv(()=>renderCompare(a,b)); }
async function renderCompare(a,b){
  const B=$("ovBody"), G=ovGen; B.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  let A,C; try { [A,C] = await Promise.all([loadFilm(a), loadFilm(b)]); } catch(e){ if(G===ovGen) B.innerHTML=errBox(e); return; }
  if (G!==ovGen) return;
  const head = (D,i) => `<div data-q="${D.q}" style="cursor:pointer;text-align:center"><div class="po" id="cp${i}" style="width:100%;aspect-ratio:2/3;border-radius:12px;background:var(--p2) center/cover;border:1px solid var(--ln)"></div><div style="font-weight:700;margin-top:6px">${esc(D.t)}</div><div class="sm mu">${D.y||""}${D.dirs.length?" · "+esc(D.dirs[0].l):""}</div></div>`;
  const castCol = D => D.cast.slice(0,8).map(c=>`<div class="lnk sm" data-person="${c.q}" style="padding:3px 0">${esc(c.l)}</div>`).join("") || `<div class="sm mu">–</div>`;
  const awCol = D => `<div class="sm"><b>${D.awards.length}</b> premi · <b>${D.noms.length}</b> candidature</div><ul class="sm" style="padding-left:16px;margin:6px 0">${D.awardsL.slice(0,8).map(x=>`<li>${esc(x.l)}${x.y?` (${x.y})`:""}</li>`).join("")}</ul>${D.awardsL.length>8?`<div class="sm mu">…e altri ${D.awardsL.length-8}</div>`:""}`;
  B.innerHTML = `<h1 style="margin:6px 0 12px">Confronto</h1><div class="two2">${head(A,0)}${head(C,1)}</div>
    ${cmpHTML(A,C)}
    <h2>Cast</h2><div class="two2"><div>${castCol(A)}</div><div>${castCol(C)}</div></div>
    <h2>Premi</h2><div class="two2"><div>${awCol(A)}</div><div>${awCol(C)}</div></div>
    <h2>Trama</h2><h3>${esc(A.t)}</h3><div id="cpl0" class="sm"><span class="spin"></span></div><h3 style="margin-top:14px">${esc(C.t)}</h3><div id="cpl1" class="sm"><span class="spin"></span></div>
    <div class="row" style="margin-top:18px"><button class="btn" id="cSwap">Confronta ${esc(C.t)} con un altro</button></div>`;
  [A,C].forEach((D,i)=>{
    bigPoster(D).then(u=>{ const p=$("cp"+i); if(p&&u&&G===ovGen) p.style.backgroundImage=`url("${u}")`; }).catch(()=>{});
    plotOf(D).then(p=>{ if(G!==ovGen) return; const x=(p.plot||p.intro||D.desc||"Trama non disponibile."); const el=$("cpl"+i); el.innerHTML=`<p style="margin:0;white-space:pre-line;max-height:150px;overflow:hidden">${esc(x)}</p>${x.length>400?`<span class="lnk">Leggi tutto</span>`:""}`; const l=el.querySelector(".lnk"); if(l) l.onclick=()=>{ el.querySelector("p").style.maxHeight="none"; l.remove(); }; });
  });
  $("cSwap").onclick = () => openFilm(C.q);
}

function slotUI(S){
  const el=$("slot"+S), q = S==="A"?cmp.a:cmp.b;
  if (!q) {
    el.className="slot";
    el.innerHTML = `<div class="sm mu" style="margin-bottom:6px">Film ${S}</div><input type="search" placeholder="Cerca un titolo…" id="in${S}" autocomplete="off"><div class="dd" id="dd${S}" style="display:none"></div>`;
    let t; $("in"+S).oninput = e => { clearTimeout(t); const s=e.target.value.trim(); t=setTimeout(async()=>{ const dd=$("dd"+S); if(!s){dd.style.display="none";return;}
      dd.style.display=""; dd.innerHTML='<div class="empty"><span class="spin"></span></div>';
      try{ const r=(await searchEntities(s)).filter(x=>x.kind==="film");
        dd.innerHTML = r.slice(0,12).map(m=>`<div class="li noprop" data-pick="${m.q}"><div class="po" ${poAttr(m.en)}></div><div class="bd"><div class="t">${esc(m.t)}</div><div class="m">${m.y||""}${m.dir?" · "+esc(m.dir):""}</div></div></div>`).join("") || '<div class="empty">Nessun film</div>';
        hydrate(dd);
        dd.onclick = ev => { const p=ev.target.closest("[data-pick]"); if(!p) return; if(S==="A") cmp.a=p.dataset.pick; else cmp.b=p.dataset.pick; renderCmp(); };
      }catch(err){ dd.innerHTML=errBox(err); } }, 400); };
    return;
  }

  const gs = gO.map(g=>{ const s=L.filter(f=>(f.g||[]).includes(g)); return {g,label:GEN[g],n:s.length,avg:avg(s),hi:s.length?s.filter(f=>f.r>=8).length/s.length*100:0}; }).filter(x=>x.n);
  // insight
  html += box("ins", `<ul class="ins">${insights(L,gs)}</ul>`);
  const LR=sfiltered("r"); const rc=Array.from({length:10},(_,i)=>({x:i+1,v:LR.filter(f=>f.r===i+1).length,color:rColor(i+1),r:i+1}));
  html += box("rd", cols(rc, i=>i.r>=SF.rmin&&i.r<=SF.rmax) + `<div class="sm mu">Tocca una barra per filtrare quel voto</div>`);
  const LY=sfiltered("y"); const decs=[...new Set(W.map(f=>Math.floor(f.y/10)*10))].sort();
  const dc=decs.map(d=>{const s=LY.filter(f=>Math.floor(f.y/10)*10===d); return {x:"'"+String(d).slice(2),v:s.length,d,color:s.length?rColor(avg(s)):"var(--ln)"};});
  html += box("dec", cols(dc, i=>i.d+9>=SF.y1&&i.d<=SF.y2) + `<div class="sm mu">Colore = voto medio · tocca per filtrare</div>`);
  let gi = gs.map(x=>({...x, v:gMetric==="n"?x.n:gMetric==="avg"?x.avg:x.hi})); if(gMetric!=="n") gi=gi.filter(x=>x.n>=3); gi.sort((x,y)=>y.v-x.v); if(gMetric==="avg"&&gi.length) gi.minScale=Math.max(0,Math.min(...gi.map(i=>i.v))-.5);
  html += box("gen", `<div class="seg" id="gseg"><button data-k="n" class="${gMetric==="n"?"on":""}">Quanti</button><button data-k="avg" class="${gMetric==="avg"?"on":""}">Voto medio</button><button data-k="hi" class="${gMetric==="hi"?"on":""}">% ≥ 8</button></div><div id="gbars">${hbars(gi, i=>gMetric==="n"?`${i.n} · ⌀ ${fmt(i.avg)}`:gMetric==="avg"?`⌀ ${fmt(i.avg,2)} · ${i.n}`:`${Math.round(i.hi)}% · ${i.n}`)}</div><div class="sm mu">Tocca un genere per filtrarlo</div>`);
  // heatmap
  const hmG=gO.filter(g=>L.some(f=>(f.g||[]).includes(g))), hmD=decs.filter(d=>L.some(f=>Math.floor(f.y/10)*10===d));
  let hm=`<div class="hm"><table><tr><th></th>${hmD.map(d=>`<th>'${String(d).slice(2)}</th>`).join("")}</tr>`;
  hmG.forEach(g=>{ hm+=`<tr><td class="g">${GEN[g]}</td>`+hmD.map(d=>{const s=L.filter(f=>Math.floor(f.y/10)*10===d&&(f.g||[]).includes(g)); if(!s.length) return `<td style="background:var(--p2);color:#444">·</td>`; const v=avg(s); return `<td style="background:${rColor(v)};color:#111;opacity:${s.length<3?.55:1}">${fmt(v)}<br><small>${s.length}</small></td>`;}).join("")+`</tr>`; });
  html += box("hm", hmG.length?hm+`</table></div><div class="sm mu" style="margin-top:6px">Voto medio e numero di film; sbiadite le caselle con meno di 3 film</div>`:`<div class="empty">Nessun dato</div>`);
  // registi
  const dmap={}; L.forEach(f=>{ if(f.d) (dmap[f.d] ||= []).push(f); });
  const dm=ui.dmin||3; let ds=Object.entries(dmap).filter(([,s])=>s.length>=dm).map(([d,s])=>({label:d,n:s.length,avg:avg(s),v:dMetric==="n"?s.length:avg(s)})).sort((x,y)=>y.v-x.v||y.n-x.n).slice(0,15);
  if(dMetric==="avg"&&ds.length) ds.minScale=Math.max(0,Math.min(...ds.map(i=>i.v))-.5);
  html += box("dir", `<div class="row" style="margin-bottom:8px"><div class="seg" id="dseg" style="margin:0;flex:1"><button data-k="avg" class="${dMetric==="avg"?"on":""}">Voto medio</button><button data-k="n" class="${dMetric==="n"?"on":""}">Quanti</button></div><select id="dmin" style="width:auto">${[2,3,4,5,8].map(n=>`<option value="${n}" ${n===dm?"selected":""}>≥ ${n} film</option>`).join("")}</select></div><div id="dbars">${hbars(ds, i=>dMetric==="n"?`${i.n} · ⌀ ${fmt(i.avg)}`:`⌀ ${fmt(i.avg,2)} · ${i.n}`)}</div>`);
  const cm={}; L.forEach(f=>(cm[f.c] ||= []).push(f)); const cs=Object.entries(cm).map(([c,s])=>({c,label:CTY[c]||c,v:s.length,avg:avg(s)})).sort((x,y)=>y.v-x.v).slice(0,12);
  html += box("cty", `<div id="cbars">${hbars(cs, i=>`${i.v} · ⌀ ${fmt(i.avg)}`)}</div>`);
  const wys=[...new Set(W.map(f=>year(f.dt)).filter(Boolean))].sort(); const wc=wys.map(y=>{const s=L.filter(f=>year(f.dt)===y); return {x:y,v:s.length,y,color:s.length?rColor(avg(s)):"var(--ln)"};});
  html += box("watch", cols(wc, i=>!SF.wy||SF.wy==i.y) + `<div class="sm mu">Film segnati per anno (2020 = importazione iniziale su Must)</div>`);
  const pg=(SF.gi.size?[...SF.gi]:gO).filter(g=>L.some(f=>(f.g||[]).includes(g))).slice(0,8);
  html += box("best", pg.map(g=>`<h3 style="margin-top:10px">${GEN[g]}</h3><div class="car">${L.filter(f=>(f.g||[]).includes(g)).sort((x,y)=>y.r-x.r||y.y-x.y).slice(0,10).map(filmTile).join("")}</div>`).join("")||`<div class="empty">Nessun film</div>`);
  const tl = L.slice().sort((x,y)=>y.r-x.r||x.t.localeCompare(y.t));
  html += box("tab", tl.slice(0,statShown).map(f=>`<div class="li" data-fk="${esc(f.k)}"><div class="bd"><div class="t">${esc(f.t)}</div><div class="m">${f.y} · ${esc(f.d||"–")} · ${(f.g||[]).map(g=>GEN[g]).join(", ")}</div></div><span class="rt" style="background:${rColor(f.r)}">${f.r}</span></div>`).join("") + (tl.length>statShown?`<button class="btn" id="stMore" style="display:block;margin:12px auto">Mostra altri (${tl.length-statShown})</button>`:""), `<span class="sm mu">${L.length}</span>`);
  O.innerHTML = html;
  lazy(O);
  // interazioni
  O.querySelectorAll(".box>.bh").forEach(h=>h.onclick=()=>{ const b=h.parentElement; b.classList.toggle("open"); ui.cOpen[b.dataset.c]=b.classList.contains("open"); saveUI(); });
  const rdC=O.querySelector('[data-c="rd"] .cols'); if(rdC) rdC.onclick=e=>{const c=e.target.closest(".col"); if(!c) return; const r=+c.dataset.k+1; if(SF.rmin===r&&SF.rmax===r){SF.rmin=1;SF.rmax=10;} else SF.rmin=SF.rmax=r; drawStats(); };
  const dcC=O.querySelector('[data-c="dec"] .cols'); if(dcC) dcC.onclick=e=>{const c=e.target.closest(".col"); if(!c) return; const d=dc[+c.dataset.k].d; if(SF.y1===Math.max(d,y0)&&SF.y2===Math.min(d+9,y9)){SF.y1=y0;SF.y2=y9;} else {SF.y1=Math.max(d,y0);SF.y2=Math.min(d+9,y9);} drawStats(); };
  const wC=O.querySelector('[data-c="watch"] .cols'); if(wC) wC.onclick=e=>{const c=e.target.closest(".col"); if(!c) return; const y=wc[+c.dataset.k].y; SF.wy = SF.wy==y?"":String(y); drawStats(); };
  const gb=$("gbars"); if(gb) gb.onclick=e=>{const n=e.target.closest(".nm"); if(!n) return; const g=gi[+n.dataset.k].g; if(SF.gi.has(g)&&SF.gi.size===1) SF.gi.clear(); else { SF.gi=new Set([g]); SF.gx.delete(g);} drawStats(); };
  const gsg=$("gseg"); if(gsg) gsg.onclick=e=>{const b=e.target.closest("button"); if(b){gMetric=b.dataset.k; drawStats();}};
  const dsg=$("dseg"); if(dsg) dsg.onclick=e=>{const b=e.target.closest("button"); if(b){dMetric=b.dataset.k; drawStats();}};
  const dmi=$("dmin"); if(dmi) dmi.onchange=e=>{ui.dmin=+e.target.value; saveUI(); drawStats();};
  const db=$("dbars"); if(db) db.onclick=e=>{const n=e.target.closest(".nm"); if(!n) return; const d=ds[+n.dataset.k].label; SF.d = SF.d===d?"":d; drawStats(); };
  const cb=$("cbars"); if(cb) cb.onclick=e=>{const n=e.target.closest(".nm"); if(!n) return; const c=cs[+n.dataset.k].c; SF.c = SF.c===c?"":c; drawStats(); };
  const sm=$("stMore"); if(sm) sm.onclick=()=>{ statShown+=100; drawStats(); };
}
function insights(L, gs){
  const out=[]; if(!L.length) return "<li>Nessun film con questi filtri.</li>";
  const a=avg(L), big=gs.filter(g=>g.n>=Math.max(5,L.length*.03));
  if (big.length){ const byN=big.slice().sort((x,y)=>y.n-x.n); out.push(`Il genere che guardi di più: <b>${byN[0].label}</b> (${byN[0].n} film${byN[1]?`, poi ${byN[1].label} con ${byN[1].n}`:""}).`);
    const byA=big.slice().sort((x,y)=>y.avg-x.avg); if(byA.length>=3){ out.push(`I generi che premi di più: <b>${byA[0].label}</b> (⌀ ${fmt(byA[0].avg,2)}), <b>${byA[1].label}</b> (⌀ ${fmt(byA[1].avg,2)}) e <b>${byA[2].label}</b> (⌀ ${fmt(byA[2].avg,2)}).`); const w=byA[byA.length-1]; out.push(`Il genere con cui sei più severo: <b>${w.label}</b>, ⌀ ${fmt(w.avg,2)}.`); } }
  const dm={}; L.forEach(f=>(dm[Math.floor(f.y/10)*10] ||= []).push(f));
  const dd=Object.entries(dm).filter(([,s])=>s.length>=8).map(([d,s])=>({d:+d,n:s.length,a:avg(s)}));
  const dl = d => d>=2000?d:String(d).slice(2);
  if (dd.length>=2){ const b=dd.slice().sort((x,y)=>y.a-x.a)[0], m=dd.slice().sort((x,y)=>y.n-x.n)[0]; out.push(`Decennio preferito: <b>anni ${dl(b.d)}</b> (⌀ ${fmt(b.a,2)} su ${b.n} film); il più guardato: <b>anni ${dl(m.d)}</b> (${m.n}).`);
    const o=L.filter(f=>f.y<1980), n=L.filter(f=>f.y>=2015); if(o.length>=8&&n.length>=8) out.push(`Prima del 1980: ⌀ <b>${fmt(avg(o),2)}</b> · dal 2015: ⌀ <b>${fmt(avg(n),2)}</b>.`); }
  const dmap={}; L.forEach(f=>{ if(f.d) (dmap[f.d] ||= []).push(f); });
  const dr=Object.entries(dmap).filter(([,s])=>s.length>=4).map(([d,s])=>({d,n:s.length,a:avg(s)})).sort((x,y)=>y.a-x.a);
  if (dr.length) out.push(`Regista del cuore (almeno 4 film): <b>${esc(dr[0].d)}</b>, ⌀ ${fmt(dr[0].a,2)} su ${dr[0].n}${dr[1]?`; poi ${esc(dr[1].d)} (⌀ ${fmt(dr[1].a,2)})`:""}.`);
  const sd=Math.sqrt(L.reduce((s,f)=>s+(f.r-a)**2,0)/L.length);
  out.push(`Deviazione standard ${fmt(sd,2)}: ${L.filter(f=>f.r>=7&&f.r<=8).length} film su ${L.length} tra 7 e 8; dieci pieni <b>${L.filter(f=>f.r===10).length}</b>, insufficienze (≤ 5) <b>${L.filter(f=>f.r<=5).length}</b>.`);
  return out.map(x=>`<li>${x}</li>`).join("");
}
