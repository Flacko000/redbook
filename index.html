<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RedBook">
<meta name="theme-color" content="#f4ede1">
<meta name="robots" content="noindex, nofollow">
<title>RedBook</title>
<style>
:root{--bg:#f4ede1;--p:#fbf7ef;--p2:#efe5d3;--ln:#e2d5c0;--tx:#2b1d17;--mu:#8a7462;--acc:#7b1e2b;--acc2:#a3404d;--ok:#2f6b3f;--ko:#a33a2e;--nav:58px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;overflow-x:hidden}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
h1{font-size:25px;line-height:1.15;margin:4px 0;letter-spacing:-.3px;overflow-wrap:anywhere}
h2{font-size:17px;margin:24px 0 10px;font-weight:650}
h3{font-size:15px;margin:0 0 8px}
.sm{font-size:13px}.mu{color:var(--mu)}
.wrap{max-width:760px;margin:0 auto;padding:calc(var(--st) + 10px) 16px calc(var(--nav) + var(--sb) + 28px)}
.view{display:none}.view.on{display:block}
body.ovon .view{display:none}
#ov{display:none}body.ovon #ov{display:block}
.row{display:flex;gap:8px;align-items:center}.wrapr{flex-wrap:wrap}.sp{flex:1}
.brand{font-weight:800;color:var(--acc);font-size:24px;letter-spacing:.2px;font-family:Georgia,"Times New Roman",serif}
.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:12px 0}
.btn{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:8px 13px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--tx)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.on{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.lnk{color:var(--acc);cursor:pointer;text-decoration:none}
input[type=search],input[type=text],select,textarea{background:var(--p);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus{border-color:var(--acc)}
.seg{display:flex;background:var(--p2);border-radius:11px;padding:3px;gap:3px;margin:6px 0 12px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:8px 4px;font-size:14px;color:var(--mu);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--p);color:var(--acc);font-weight:650;box-shadow:0 1px 2px rgba(60,30,20,.12)}
/* barra in basso */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fbf7ef;border-top:1px solid var(--ln);display:flex;padding-bottom:var(--sb)}
nav.bar button{flex:1;background:none;border:0;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mu);font-size:11px;cursor:pointer}
nav.bar svg{width:23px;height:23px}
nav.bar button.on{color:var(--acc)}
/* locandine */
.car{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.tile{flex:0 0 108px;cursor:pointer;position:relative}
.po{background:var(--p2) center/cover no-repeat;border-radius:9px;overflow:hidden;position:relative}
.tile .po{width:108px;height:162px;display:flex;align-items:flex-end;justify-content:center;padding:6px;text-align:center;font-size:11px;color:var(--mu);font-family:Georgia,serif}
.po.has>span{display:none}
.tile .tt{font-size:12.5px;margin-top:5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .yy{font-size:11.5px;color:var(--mu)}
.badge{position:absolute;top:6px;right:6px;border-radius:7px;padding:1px 6px;font-size:12px;font-weight:700;color:#fff}
.badge.wl{background:var(--acc2);font-size:10.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 .tile .po{width:100%;height:auto;aspect-ratio:2/3}
/* liste */
.li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--ln);cursor:pointer;align-items:center;content-visibility:auto;contain-intrinsic-size:auto 82px}
.li .po{flex:0 0 44px;height:66px;border-radius:6px}
.li .po>span{display:none}
.li .bd{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{display:inline-block;min-width:30px;text-align:center;border-radius:7px;padding:2px 6px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.empty{color:var(--mu);text-align:center;padding:22px 8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--p);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.chip.off{background:#f3dcd6;border-color:#d9a99f;color:#8a3a2e;text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--ln);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
/* sezioni a fisarmonica (+/−) */
details.sec{background:var(--p);border:1px solid var(--ln);border-radius:13px;margin:10px 0}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer;font-weight:650;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";margin-left:auto;font-size:22px;line-height:1;color:var(--acc);font-weight:500}
details.sec[open]>summary::after{content:"−"}
details.sec>summary .val{font-weight:500;font-size:12.5px;color:var(--acc);margin-left:auto;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.sec>summary .val+*{margin-left:0}
details.sec>.in{padding:0 14px 14px}
/* scheda film */
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:calc(var(--st) + 8px) 16px 8px;display:flex;gap:8px;align-items:center;border-bottom:1px solid transparent}
.fhead{display:flex;gap:14px;margin-top:6px}
.fhead .po{flex:0 0 112px;height:168px;border-radius:10px;box-shadow:0 2px 8px rgba(60,30,20,.15)}
.fhead .po>span{display:flex;height:100%;align-items:center;justify-content:center;padding:8px;text-align:center;font-family:Georgia,serif;color:var(--mu);font-size:13px}
.fhead .ti{min-width:0;align-self:center}
.kv{display:grid;grid-template-columns:86px 1fr;gap:7px 10px;font-size:14.5px}
.kv>div:nth-child(odd){color:var(--mu)}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.rate button{border:1px solid var(--ln);background:var(--p);border-radius:8px;padding:9px 0;font-weight:700;cursor:pointer;font-size:14px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:var(--p2);border-radius:11px;padding:9px;text-align:center}
.sc .v{font-size:20px;font-weight:700}
.sc .l{font-size:11.5px;color:var(--mu);line-height:1.2}
.plot{margin:0;line-height:1.55}
/* confronto */
.ct{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.ct td{padding:9px 4px;border-bottom:1px solid var(--ln);vertical-align:top;width:37%;overflow-wrap:anywhere}
.ct td.k{width:26%;color:var(--mu);font-size:11.5px;text-align:center}
.ct td.w{color:var(--ok);font-weight:700}
.ct td:last-child{text-align:right}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--p);border:1px dashed var(--ln);border-radius:13px;padding:10px;min-height:110px;position:relative}
.slot .po{width:100%;aspect-ratio:2/3}
.dd{margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sb) + 14px);transform:translateX(-50%);background:var(--tx);color:#fff;border-radius:12px;padding:10px 14px;z-index:90;font-size:14px;display:none;max-width:90vw}
.toast.on{display:block}
textarea{min-height:90px;font-size:12px}
.prog{height:6px;background:var(--p2);border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--acc);width:0}
.tile:active,.li:active,.btn:active,.chip:active{opacity:.6}
/* analisi (riuso) */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px}
.kpi .v{font-size:24px;font-weight:700}.kpi .l{font-size:12px;color:var(--mu)}
.box{background:var(--p);border:1px solid var(--ln);border-radius:14px;margin:12px 0}
.box>.bh{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none}
.box>.bh h3{margin:0;flex:1}
.box>.bh .ar{color:var(--acc);font-size:20px;line-height:1}
.box>.bh .ar::before{content:"+"}.box.open>.bh .ar::before{content:"−"}
.box>.bh .ar{font-size:0}.box>.bh .ar::before{font-size:22px}
.box>.bb{display:none;padding:0 14px 14px}.box.open>.bb{display:block}
.hb{display:grid;grid-template-columns:minmax(90px,36%) 1fr auto;gap:6px 8px;align-items:center;font-size:13.5px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hb .tr{background:var(--p2);border-radius:6px;height:15px;position:relative;overflow:hidden}
.hb .fl{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.hb .vl{font-variant-numeric:tabular-nums;color:var(--mu);font-size:12.5px;min-width:64px;text-align:right}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;cursor:pointer}
.col .b{width:100%;border-radius:5px 5px 0 0;position:relative;min-height:2px}
.col .b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mu);white-space:nowrap}
.col .x{font-size:11px;color:var(--mu);margin-top:4px;white-space:nowrap}
.ins{margin:0;padding-left:18px}.ins li{margin:6px 0}.ins b{color:var(--acc)}
.hm{overflow-x:auto}.hm table{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:500px}
.hm td,.hm th{text-align:center;padding:6px 4px;border-radius:6px}.hm th{color:var(--mu);font-weight:500}.hm td.g{text-align:left;white-space:nowrap}
.acc{border:1px solid var(--ln);border-radius:12px;margin:8px 0;background:var(--p)}
.acc>.ah{display:flex;align-items:center;gap:8px;padding:12px;cursor:pointer;user-select:none}
.acc>.ah .ar{display:none}
.acc>.ah::after{content:"+";font-size:22px;color:var(--acc);line-height:1}
.acc.open>.ah::after{content:"−"}
.acc>.ab{display:none;padding:0 12px 12px}.acc.open>.ab{display:block}
.acc .val{font-size:12.5px;color:var(--acc);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eye{background:none;border:0;color:var(--mu);font-size:13px;padding:4px 6px;cursor:pointer}
.sheetbg{position:fixed;inset:0;background:rgba(40,20,10,.35);z-index:70;display:none}.sheetbg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--bg);border-radius:18px 18px 0 0;max-height:86vh;display:none;flex-direction:column;max-width:760px;margin:0 auto}
.sheet.on{display:flex}
.sheet .sh{padding:10px 14px;border-bottom:1px solid var(--ln);display:flex;gap:8px;align-items:center}
.sheet .grab{width:40px;height:4px;background:var(--ln);border-radius:4px;margin:8px auto 0}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 14px calc(18px + var(--sb));flex:1}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
.factive{font-size:12.5px;color:var(--mu)}.factive b{color:var(--acc)}
label.sm select{margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-search">
    <div class="seg" id="srchSeg"><button data-m="film" class="on">Cerca film</button><button data-m="cmp">Confronta</button></div>
    <div id="filmPane"></div><div id="cmpPane" style="display:none"></div>
  </section>
  <section class="view" id="v-prof">
    <div id="profHead"></div>
    <div class="seg" id="profSeg"><button data-p="seen" class="on">Visti</button><button data-p="wl">Watchlist</button><button data-p="stats">Analisi</button><button data-p="set">⚙︎</button></div>
    <div id="profBody"></div>
  </section>
  <section id="ov"><div class="top"><button class="btn" id="ovBack">‹ Indietro</button><span class="sp"></span><button class="btn" id="ovClose">Chiudi</button></div><div id="ovBody"></div></section>
</div>
<nav class="bar" id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-v="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Cerca</button>
  <button data-v="prof"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profilo</button>
</nav>
<div class="sheetbg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="sh"><b style="flex:1">Filtri</b><button class="btn sm" id="fCustom">Personalizza</button><button class="btn sm" id="fReset">Azzera</button><button class="btn sm pri" id="fDone">Fatto</button></div><div class="sb" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="pickCsv" accept=".csv,text/csv,text/plain" style="display:none">
<input type="file" id="pickBk" accept=".json,application/json,text/plain" style="display:none">

/* ---------- memoria ---------- */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem("vc."+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("vc."+k, JSON.stringify(v)); return true; }catch(e){ toast("Memoria del browser piena"); return false; } },
  q(k,v){ try{ localStorage.setItem("vc."+k, JSON.stringify(v)); }catch(e){} }
};
const today = () => new Date().toISOString().slice(0,10);
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
let films = LS.get("films", {});
let META = LS.get("meta4", null);
let ui = LS.get("ui", {});
let name = LS.get("name", "Vinicio");
const saveFilms = () => LS.set("films", films);
const saveUI = () => LS.q("ui", ui);

/* ---------- archivio film (catalogo + tuoi film) ---------- */
let DB = {};           // chiave -> film {k,t,y,rt,d,cast,castA,g,c,aw,plot}
let TY = {};           // titolo|anno -> chiave (per evitare doppioni)
function addDB(o){ o.castA = (o.cast||"").split(",").map(s=>s.trim()).filter(Boolean); o.n = norm(o.t); DB[o.k]=o; TY[o.n+"|"+o.y]=o.k; }
function buildDB(){
  DB={}; TY={};
  CAT.forEach(c=>addDB({k:c[0],t:c[1],y:c[2],rt:c[3],d:c[4],cast:c[5],g:c[6],c:c[7],aw:c[8],plot:c[9]}));
  for (const f of Object.values(films)) {
    const m = META && META[f.k];
    // un tuo film che è anche in catalogo: usa una sola scheda
    if (DB[f.k] && !m) continue;
    const dup = TY[norm(f.t)+"|"+f.y] || TY[norm(f.t)+"|"+(f.y-1)] || TY[norm(f.t)+"|"+(f.y+1)];
    if (dup && dup!==f.k && dup.startsWith("c:") && !m) { if(!films[dup]) { const o=DB[dup]; delete DB[dup]; o.k=f.k; addDB(o); } continue; }
    addDB({k:f.k, t:f.t, y:f.y, rt:m?m[0]:0, d:f.d||"", cast:m?m[1]:"", g:f.g||[], c:f.c||"", aw:m?m[2]:"", plot:m?m[3]:"", imdb:f.imdb||""});
  }
}
const ALL = () => Object.values(DB);
const statOf = k => films[k]?.st || "";
const isSeen = o => statOf(o.k)==="w";
const watched = () => Object.values(films).filter(f=>f.st==="w");
const wlist = () => Object.values(films).filter(f=>f.st==="l");

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt = (x,d=1) => (x==null||isNaN(x)) ? "–" : (+x).toFixed(d).replace(".", ",");
const avg = a => a.length ? a.reduce((s,f)=>s+f.r,0)/a.length : 0;
function rColor(v){ const t=Math.max(0,Math.min(1,(v-4)/5.5)); return `hsl(${4+t*118},${45+t*5}%,${36+t*4}%)`; }
let tT; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove("on"),2400); }
const shuffle = (a,seed) => { let s=seed||1; const r=()=> (s=(s*9301+49297)%233280)/233280; return a.map(x=>[r(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]); };
const daySeed = () => +today().replace(/-/g,"");
const year = d => d ? +String(d).slice(0,4) : 0;
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };

/* ---------- somiglianza (tutto in locale, istantaneo) ---------- */
function sim(a,b){
  if (a.k===b.k) return -1;
  let s=0;
  if (a.d && b.d && a.d===b.d) s+=4;
  for (const x of a.castA) if (b.castA.includes(x)) s+=1.5;
  let gg=0; for (const g of a.g) if (b.g.includes(g)) gg++;
  s += gg*1.2;
  if (a.y && b.y) { const dy=Math.abs(a.y-b.y); s += dy<=6?1:dy<=15?.4:0; }
  if (a.c && a.c===b.c && a.c!=="US") s+=.8;
  return s;
}
function similar(o, {n=16, unseen=false, min=2.6}={}){
  const out=[];
  for (const b of ALL()) { if (unseen && statOf(b.k)==="w") continue; const s=sim(o,b); if (s>=min) out.push([s,b]); }
  return out.sort((x,y)=>y[0]-x[0]).slice(0,n).map(x=>x[1]);
}

/* ---------- locandine da Wikipedia (solo immagini, in blocchi da 50) ---------- */
let PO = LS.get("po4", {});      // chiave -> [url, titoloWiki] oppure 0
const pend = new Map(); let pT;
function needPoster(k){ if (k in PO || pend.has(k)) return; const o=DB[k]; if(!o) return; pend.set(k,0); clearTimeout(pT); pT=setTimeout(flushPosters, 60); }
const cands = o => [`${o.t} (${o.y} film)`, `${o.t} (film)`, o.t];
let busy=0;
async function flushPosters(){
  if (busy>=2) { pT=setTimeout(flushPosters, 150); return; }
  const take=[...pend.entries()].slice(0,50); if(!take.length) return;
  take.forEach(([k])=>pend.delete(k));
  const byStage={0:[],1:[],2:[]}; take.forEach(([k,st])=>byStage[st].push(k));
  busy++;
  try{
    for (const st of [0,1,2]) {
      const ks=byStage[st]; if(!ks.length) continue;
      const titles=ks.map(k=>cands(DB[k])[st]);
      const u="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages%7Cpageterms&piprop=thumbnail&pithumbsize=300&pilimit=50&pilicense=any&wbptterms=description&titles="+encodeURIComponent(titles.join("|"));
      const r = await fetch(u); if(!r.ok) throw 0; const j = await r.json();
      const map={}; (j.query?.normalized||[]).forEach(x=>map[x.from]=x.to);
      (j.query?.redirects||[]).forEach(x=>{ for (const f in map) if(map[f]===x.from) map[f]=x.to; map[x.from]=x.to; });
      const pages={}; Object.values(j.query?.pages||{}).forEach(p=>pages[p.title]=p);
      ks.forEach((k,i)=>{ const o=DB[k]; let t=titles[i]; t=map[t]||t; t=map[t]||t; const p=pages[t];
        const desc=(p?.terms?.description||[""])[0].toLowerCase();
        const okFilm = /film|movie|documentary|anime/.test(desc) && (!o.y || !/\b(19|20)\d\d\b/.test(desc) || [o.y-1,o.y,o.y+1].some(y=>desc.includes(String(y))));
        if (p && p.pageid && okFilm && p.thumbnail?.source) PO[k]=[p.thumbnail.source, p.title];
        else if (p && p.pageid && okFilm) PO[k]=["", p.title];
        else if (st<2) pend.set(k, st+1);
        else PO[k]=0;
      });
      applyPosters(ks);
    }
  }catch(e){}
  busy--;
  savePO();
  if (pend.size) { clearTimeout(pT); pT=setTimeout(flushPosters, 40); }
}
let sPT; const savePO = () => { clearTimeout(sPT); sPT=setTimeout(()=>LS.q("po4",PO),800); };
function applyPosters(ks){ const set=new Set(ks); document.querySelectorAll(".po[data-k]:not(.has)").forEach(el=>{ if(set.has(el.dataset.k)) paint(el); }); }
function paint(el){ const p=PO[el.dataset.k]; if (p && p[0]) { el.style.backgroundImage=`url("${p[0]}")`; el.classList.add("has"); } }
const io = ("IntersectionObserver" in window) ? new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; io.unobserve(e.target); const k=e.target.dataset.k; if (k in PO) paint(e.target); else needPoster(k); }),{rootMargin:"500px 300px"}) : null;
function hydrate(root){ (root||document).querySelectorAll(".po[data-k]:not(.has)").forEach(el=>{ const k=el.dataset.k; if (k in PO) paint(el); else if (io) io.observe(el); else needPoster(k); }); }
const lazy = hydrate;
const poStyle = k => { const p=PO[k]; return p&&p[0] ? ` has" style="background-image:url(&quot;${esc(p[0])}&quot;)` : ""; };

/* ---------- navigazione ---------- */
let cur="home"; const viewY={}; const stack=[];
$("nav").onclick = e => { const b=e.target.closest("button"); if(b) go(b.dataset.v); };
function go(v){
  if (stack.length) { stack.length=0; document.body.classList.remove("ovon"); }
  else if (v===cur) { window.scrollTo({top:0,behavior:"smooth"}); return; }
  else viewY[cur]=window.scrollY;
  cur=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on", s.id==="v-"+v));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  if (v==="home") renderHome(); if (v==="prof") renderProfile(); if (v==="search") setSrch(sMode, true);
  window.scrollTo(0, viewY[v]||0);
}
function push(page){ if (stack.length) stack[stack.length-1].y=window.scrollY; else viewY[cur]=window.scrollY; stack.push(page); document.body.classList.add("ovon"); page.render(); window.scrollTo(0,0); }
$("ovBack").onclick = () => { stack.pop(); if (!stack.length) { document.body.classList.remove("ovon"); refresh(); window.scrollTo(0, viewY[cur]||0); return; } const p=stack[stack.length-1]; p.render(); window.scrollTo(0,p.y||0); };
$("ovClose").onclick = () => { stack.length=0; document.body.classList.remove("ovon"); refresh(); window.scrollTo(0, viewY[cur]||0); };
function refresh(){ if (cur==="home") renderHome(); if (cur==="prof") renderProfile(); if (cur==="search" && sMode==="film") runSearch(); }

/* ---------- sblocco dei tuoi film ---------- */
function unlockCard(again){
  return `<div class="card"><h3>${again?"Aggiornamento: sblocca di nuovo":"Sblocca i tuoi film"}</h3><p class="sm mu" style="margin-top:0">${again?"Questa versione ha schede, trame e cast nuovi per i tuoi film. Inserisci il codice una sola volta: voti e watchlist restano come sono.":"I tuoi film sono dentro l'app, protetti da un codice. Inseriscilo una volta sola: poi restano su questo telefono."}</p>
  <input type="text" id="pin" placeholder="Codice" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn pri" style="width:100%;margin-top:8px" id="pinGo">Sblocca</button><div id="pinMsg" class="sm" style="margin-top:6px;color:var(--ko)"></div></div>`;
}
function bindUnlock(){
  const b=$("pinGo"); if(!b) return;
  b.onclick = async () => {
    const pin=$("pin").value.trim().toLowerCase(), msg=$("pinMsg");
    if (!(window.crypto&&crypto.subtle)) { msg.textContent="Apri l'app dal suo indirizzo web in Safari, non dall'anteprima del file."; return; }
    b.disabled=true; msg.textContent="";
    try{
      const raw=Uint8Array.from(atob(ENC),c=>c.charCodeAt(0));
      const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
      const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:raw.slice(0,16),iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
      const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(16,28)},key,raw.slice(28))));
      META=d.meta; LS.set("meta4", META);
      if (!Object.keys(films).length) { films=d.films; saveFilms(); }
      else { for (const [k,f] of Object.entries(d.films)) { const x=films[k]; if (x && !x.g?.length) { x.g=f.g; x.d=x.d||f.d; x.c=x.c||f.c; } } saveFilms(); }
      buildDB(); resetSF(); toast("Film sbloccati: "+watched().length); renderHome();
    }catch(e){ msg.textContent="Codice errato"; b.disabled=false; }
  };
}

/* ---------- HOME ---------- */
function recsForYou(){
  const key="rec4:"+today()+":"+watched().length;
  const c=LS.get("recs",null); if (c && c.key===key) return c.ks.map(k=>DB[k]).filter(o=>o && !isSeen(o));
  const loved = watched().filter(f=>f.r>=8).map(f=>[DB[f.k], f.r-7]).filter(x=>x[0]);
  const pool = ALL().filter(o=>!films[o.k]);
  const sc = pool.map(o=>{ let s=0; for (const [L,w] of loved) { const v=sim(o,L); if (v>=2.6) s+=v*w; } return [s,o]; }).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
  const top = sc.slice(0,40).map(x=>x[1]);
  const pick = [...top.slice(0,8), ...shuffle(top.slice(8),daySeed())].slice(0,24);
  LS.q("recs",{key, ks:pick.map(o=>o.k)});
  return pick;
}
function becauseYouLoved(){
  const loved = shuffle(watched().filter(f=>f.r>=9 && DB[f.k]), daySeed()).slice(0,8);
  let best=null, list=[];
  for (const f of loved) { const l=similar(DB[f.k],{n:16,unseen:true}).filter(o=>!films[o.k]); if (l.length>list.length) { best=f; list=l; } if (list.length>=8) break; }
  return best ? {f:best, list} : null;
}
function renderHome(){
  const has = Object.keys(films).length>0, W=watched(), L=wlist();
  let h = `<div class="row" style="margin:2px 0 4px"><div class="brand">RedBook</div><span class="sp"></span>${has?`<span class="sm mu">${W.length} visti · ⌀ ${fmt(avg(W),2)}</span>`:""}</div>`;
  if (!has) { $("v-home").innerHTML = h + unlockCard(false) + `<h2>Da scoprire</h2>` + car(shuffle(CAT.map(c=>DB[c[0]]).filter(Boolean),daySeed()).slice(0,20)); bindUnlock(); hydrate($("v-home")); return; }
  if (!META) h += unlockCard(true);
  h += `<h2>Consigliati per te</h2>` + car(recsForYou());
  if (L.length) h += `<h2>La tua watchlist</h2>` + car(L.slice().sort((a,b)=>(b.dt||"").localeCompare(a.dt||"")).slice(0,20).map(f=>DB[f.k]||{k:f.k,t:f.t,y:f.y}));
  const b = becauseYouLoved();
  if (b) h += `<h2>Perché hai amato <span style="color:var(--acc)">${esc(b.f.t)}</span></h2>` + car(b.list);
  $("v-home").innerHTML = h; bindUnlock(); hydrate($("v-home"));
}

/* punteggi: una sola richiesta leggera a Wikidata, solo se la sezione è aperta */
let SC = LS.get("sc4", {});
async function scoresOf(k){
  if (SC[k] && Date.now()-SC[k].at < 30*864e5) return SC[k].v;
  const o=DB[k]; const wt = PO[k] && PO[k][1];
  if (!o.imdb && !wt) { await new Promise(r=>{ needPoster(k); let n=0; const iv=setInterval(()=>{ if (k in PO || ++n>30) { clearInterval(iv); r(); } },200); }); }
  const t2 = PO[k] && PO[k][1];
  const where = o.imdb ? `?f wdt:P345 "${o.imdb}" .` : t2 ? `?a schema:about ?f ; schema:isPartOf <https://en.wikipedia.org/> ; schema:name "${t2.replace(/"/g,'\\"')}"@en .` : null;
  if (!where) return null;
  const q = `SELECT ?v ?by ?ml WHERE { ${where} ?f p:P444 ?s . ?s ps:P444 ?v ; pq:P447 ?by . OPTIONAL{ ?s pq:P459 ?m . ?m rdfs:label ?ml FILTER(LANG(?ml)="en") } } LIMIT 40`;
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),15000);
  try{
    const r = await fetch("https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(q),{signal:ctl.signal});
    const j = await r.json(); const v={rt:null,rta:null,mc:null,imdb:null};
    j.results.bindings.forEach(b=>{ const by=b.by.value.split("/").pop(), val=b.v.value, ml=(b.ml?.value||"").toLowerCase(), aud=/audience|popcorn|user/.test(ml);
      if (by==="Q105584" && /%$/.test(val)) { if (aud) v.rta ??= parseInt(val); else v.rt ??= parseInt(val); }
      else if (by==="Q150248" && /\/100$/.test(val) && !aud) v.mc ??= parseInt(val);

function pickCsv(kind){ $("pickCsv").dataset.kind=kind; $("pickCsv").click(); }
function parseCSV(t){ const rows=[]; let row=[], v="", q=false; for (let i=0;i<t.length;i++){ const c=t[i]; if (q) { if (c==='"') { if (t[i+1]==='"'){v+='"';i++;} else q=false; } else v+=c; } else if (c==='"') q=true; else if (c===',') {row.push(v);v="";} else if (c==='\n'||c==='\r') { if(c==='\r'&&t[i+1]==='\n') i++; row.push(v); rows.push(row); row=[]; v=""; } else v+=c; } if (v||row.length) { row.push(v); rows.push(row); } return rows.filter(r=>r.some(x=>x.trim())); }
function importCSV(txt, kind){
  const rows=parseCSV(txt.replace(/^﻿/,"")); if(rows.length<2) return {err:"File vuoto o non riconosciuto"};
  const h=rows[0].map(x=>x.trim().toLowerCase()); const ci=n=>h.findIndex(x=>n.includes(x));
  const iI=ci(["imdbid","imdb id","const"]), iT=ci(["title","titolo","name"]), iY=ci(["year","anno"]), iR=ci(["rating10","rating","voto"]), iD=ci(["watcheddate","date","data"]);
  if (iT<0) return {err:"Colonna del titolo non trovata"};
  let add=0, upd=0;
  rows.slice(1).forEach(r=>{ const imdb=(iI>=0?r[iI]:"").trim(), t=(r[iT]||"").trim(), y=+(r[iY]||0); if(!t) return;
    const ex = (imdb && films[imdb]) || Object.values(films).find(f=>norm(f.t)===norm(t)&&Math.abs(f.y-y)<=1);
    let rv = iR>=0 ? parseFloat(r[iR]) : NaN;
    if (ex) { if (kind==="w" && rv) { ex.r=Math.round(rv); if(ex.st!=="w"){ex.st="w"; ex.dt=(iD>=0&&r[iD])||today();} upd++; } return; }
    const ck = TY[norm(t)+"|"+y]; const k = ck || imdb || ("x:"+norm(t)+"|"+y); const o=DB[k];
    films[k]={k, imdb, t, y, r: kind==="w"&&rv?Math.round(rv):0, st:kind, dt:(iD>=0&&r[iD])||today(), g:o?.g||[], c:o?.c||"", d:o?.d||""}; add++; });
  saveFilms(); return {add, upd};
}

  html += box("ins", `<ul class="ins">${insights(L,gs)}</ul>`);
  const LR=sfiltered("r"); const rc=Array.from({length:10},(_,i)=>({x:i+1,v:LR.filter(f=>f.r===i+1).length,color:rColor(i+1),r:i+1}));
  html += box("rd", cols(rc, i=>i.r>=SF.rmin&&i.r<=SF.rmax) + `<div class="sm mu">Tocca una barra per filtrare quel voto</div>`);
  const LY=sfiltered("y"); const decs=[...new Set(W.map(f=>Math.floor(f.y/10)*10))].sort();
  const dc=decs.map(d=>{const s=LY.filter(f=>Math.floor(f.y/10)*10===d); return {x:"'"+String(d).slice(2),v:s.length,d,color:s.length?rColor(avg(s)):"var(--ln)"};});
  html += box("dec", cols(dc, i=>i.d+9>=SF.y1&&i.d<=SF.y2) + `<div class="sm mu">Colore = voto medio · tocca per filtrare</div>`);
  let gi = gs.map(x=>({...x, v:gMetric==="n"?x.n:gMetric==="avg"?x.avg:x.hi})); if(gMetric!=="n") gi=gi.filter(x=>x.n>=3); gi.sort((x,y)=>y.v-x.v); if(gMetric==="avg"&&gi.length) gi.minScale=Math.max(0,Math.min(...gi.map(i=>i.v))-.5);
  html += box("gen", `<div class="seg" id="gseg"><button data-k="n" class="${gMetric==="n"?"on":""}">Quanti</button><button data-k="avg" class="${gMetric==="avg"?"on":""}">Voto medio</button><button data-k="hi" class="${gMetric==="hi"?"on":""}">% ≥ 8</button></div><div id="gbars">${hbars(gi, i=>gMetric==="n"?`${i.n} · ⌀ ${fmt(i.avg)}`:gMetric==="avg"?`⌀ ${fmt(i.avg,2)} · ${i.n}`:`${Math.round(i.hi)}% · ${i.n}`)}</div><div class="sm mu">Tocca un genere per filtrarlo</div>`);
  // heatmap
  const hmG=gO.filter(g=>L.some(f=>(f.g||[]).includes(g))), hmD=decs.filter(d=>L.some(f=>Math.floor(f.y/10)*10===d));
  let hm=`<div class="hm"><table><tr><th></th>${hmD.map(d=>`<th>'${String(d).slice(2)}</th>`).join("")}</tr>`;
  hmG.forEach(g=>{ hm+=`<tr><td class="g">${GEN[g]}</td>`+hmD.map(d=>{const s=L.filter(f=>Math.floor(f.y/10)*10===d&&(f.g||[]).includes(g)); if(!s.length) return `<td style="background:var(--p2);color:#444">·</td>`; const v=avg(s); return `<td style="background:${rColor(v)};color:#111;opacity:${s.length<3?.55:1}">${fmt(v)}<br><small>${s.length}</small></td>`;}).join("")+`</tr>`; });
  html += box("hm", hmG.length?hm+`</table></div><div class="sm mu" style="margin-top:6px">Voto medio e numero di film; sbiadite le caselle con meno di 3 film</div>`:`<div class="empty">Nessun dato</div>`);
  // registi
  const dmap={}; L.forEach(f=>{ if(f.d) (dmap[f.d] ||= []).push(f); });
  const dm=ui.dmin||3; let ds=Object.entries(dmap).filter(([,s])=>s.length>=dm).map(([d,s])=>({label:d,n:s.length,avg:avg(s),v:dMetric==="n"?s.length:avg(s)})).sort((x,y)=>y.v-x.v||y.n-x.n).slice(0,15);
  if(dMetric==="avg"&&ds.length) ds.minScale=Math.max(0,Math.min(...ds.map(i=>i.v))-.5);
  html += box("dir", `<div class="row" style="margin-bottom:8px"><div class="seg" id="dseg" style="margin:0;flex:1"><button data-k="avg" class="${dMetric==="avg"?"on":""}">Voto medio</button><button data-k="n" class="${dMetric==="n"?"on":""}">Quanti</button></div><select id="dmin" style="width:auto">${[2,3,4,5,8].map(n=>`<option value="${n}" ${n===dm?"selected":""}>≥ ${n} film</option>`).join("")}</select></div><div id="dbars">${hbars(ds, i=>dMetric==="n"?`${i.n} · ⌀ ${fmt(i.avg)}`:`⌀ ${fmt(i.avg,2)} · ${i.n}`)}</div>`);
  const cm={}; L.forEach(f=>(cm[f.c] ||= []).push(f)); const cs=Object.entries(cm).map(([c,s])=>({c,label:CTY[c]||c,v:s.length,avg:avg(s)})).sort((x,y)=>y.v-x.v).slice(0,12);
  html += box("cty", `<div id="cbars">${hbars(cs, i=>`${i.v} · ⌀ ${fmt(i.avg)}`)}</div>`);
  const wys=[...new Set(W.map(f=>year(f.dt)).filter(Boolean))].sort(); const wc=wys.map(y=>{const s=L.filter(f=>year(f.dt)===y); return {x:y,v:s.length,y,color:s.length?rColor(avg(s)):"var(--ln)"};});
  html += box("watch", cols(wc, i=>!SF.wy||SF.wy==i.y) + `<div class="sm mu">Film segnati per anno (2020 = importazione iniziale su Must)</div>`);
  const pg=(SF.gi.size?[...SF.gi]:gO).filter(g=>L.some(f=>(f.g||[]).includes(g))).slice(0,8);
  html += box("best", pg.map(g=>`<h3 style="margin-top:10px">${GEN[g]}</h3><div class="car">${L.filter(f=>(f.g||[]).includes(g)).sort((x,y)=>y.r-x.r||y.y-x.y).slice(0,10).map(filmTile).join("")}</div>`).join("")||`<div class="empty">Nessun film</div>`);
  const tl = L.slice().sort((x,y)=>y.r-x.r||x.t.localeCompare(y.t));
  html += box("tab", tl.slice(0,statShown).map(f=>`<div class="li" data-fk="${esc(f.k)}"><div class="bd"><div class="t">${esc(f.t)}</div><div class="m">${f.y} · ${esc(f.d||"–")} · ${(f.g||[]).map(g=>GEN[g]).join(", ")}</div></div><span class="rt" style="background:${rColor(f.r)}">${f.r}</span></div>`).join("") + (tl.length>statShown?`<button class="btn" id="stMore" style="display:block;margin:12px auto">Mostra altri (${tl.length-statShown})</button>`:""), `<span class="sm mu">${L.length}</span>`);
  O.innerHTML = html;
  lazy(O);
  // interazioni
  O.querySelectorAll(".box>.bh").forEach(h=>h.onclick=()=>{ const b=h.parentElement; b.classList.toggle("open"); ui.cOpen[b.dataset.c]=b.classList.contains("open"); saveUI(); });
  const rdC=O.querySelector('[data-c="rd"] .cols'); if(rdC) rdC.onclick=e=>{const c=e.target.closest(".col"); if(!c) return; const r=+c.dataset.k+1; if(SF.rmin===r&&SF.rmax===r){SF.rmin=1;SF.rmax=10;} else SF.rmin=SF.rmax=r; drawStats(); };
  const dcC=O.querySelector('[data-c="dec"] .cols'); if(dcC) dcC.onclick=e=>{const c=e.target.closest(".col"); if(!c) return; const d=dc[+c.dataset.k].d; if(SF.y1===Math.max(d,y0)&&SF.y2===Math.min(d+9,y9)){SF.y1=y0;SF.y2=y9;} else {SF.y1=Math.max(d,y0);SF.y2=Math.min(d+9,y9);} drawStats(); };
  const wC=O.querySelector('[data-c="watch"] .cols'); if(wC) wC.onclick=e=>{const c=e.target.closest(".col"); if(!c) return; const y=wc[+c.dataset.k].y; SF.wy = SF.wy==y?"":String(y); drawStats(); };
  const gb=$("gbars"); if(gb) gb.onclick=e=>{const n=e.target.closest(".nm"); if(!n) return; const g=gi[+n.dataset.k].g; if(SF.gi.has(g)&&SF.gi.size===1) SF.gi.clear(); else { SF.gi=new Set([g]); SF.gx.delete(g);} drawStats(); };
  const gsg=$("gseg"); if(gsg) gsg.onclick=e=>{const b=e.target.closest("button"); if(b){gMetric=b.dataset.k; drawStats();}};
  const dsg=$("dseg"); if(dsg) dsg.onclick=e=>{const b=e.target.closest("button"); if(b){dMetric=b.dataset.k; drawStats();}};
  const dmi=$("dmin"); if(dmi) dmi.onchange=e=>{ui.dmin=+e.target.value; saveUI(); drawStats();};
  const db=$("dbars"); if(db) db.onclick=e=>{const n=e.target.closest(".nm"); if(!n) return; const d=ds[+n.dataset.k].label; SF.d = SF.d===d?"":d; drawStats(); };
  const cb=$("cbars"); if(cb) cb.onclick=e=>{const n=e.target.closest(".nm"); if(!n) return; const c=cs[+n.dataset.k].c; SF.c = SF.c===c?"":c; drawStats(); };
  const sm=$("stMore"); if(sm) sm.onclick=()=>{ statShown+=100; drawStats(); };
}
function insights(L, gs){
  const out=[]; if(!L.length) return "<li>Nessun film con questi filtri.</li>";
  const a=avg(L), big=gs.filter(g=>g.n>=Math.max(5,L.length*.03));
  if (big.length){ const byN=big.slice().sort((x,y)=>y.n-x.n); out.push(`Il genere che guardi di più: <b>${byN[0].label}</b> (${byN[0].n} film${byN[1]?`, poi ${byN[1].label} con ${byN[1].n}`:""}).`);
    const byA=big.slice().sort((x,y)=>y.avg-x.avg); if(byA.length>=3){ out.push(`I generi che premi di più: <b>${byA[0].label}</b> (⌀ ${fmt(byA[0].avg,2)}), <b>${byA[1].label}</b> (⌀ ${fmt(byA[1].avg,2)}) e <b>${byA[2].label}</b> (⌀ ${fmt(byA[2].avg,2)}).`); const w=byA[byA.length-1]; out.push(`Il genere con cui sei più severo: <b>${w.label}</b>, ⌀ ${fmt(w.avg,2)}.`); } }
  const dm={}; L.forEach(f=>(dm[Math.floor(f.y/10)*10] ||= []).push(f));
  const dd=Object.entries(dm).filter(([,s])=>s.length>=8).map(([d,s])=>({d:+d,n:s.length,a:avg(s)}));
  const dl = d => d>=2000?d:String(d).slice(2);
  if (dd.length>=2){ const b=dd.slice().sort((x,y)=>y.a-x.a)[0], m=dd.slice().sort((x,y)=>y.n-x.n)[0]; out.push(`Decennio preferito: <b>anni ${dl(b.d)}</b> (⌀ ${fmt(b.a,2)} su ${b.n} film); il più guardato: <b>anni ${dl(m.d)}</b> (${m.n}).`);
    const o=L.filter(f=>f.y<1980), n=L.filter(f=>f.y>=2015); if(o.length>=8&&n.length>=8) out.push(`Prima del 1980: ⌀ <b>${fmt(avg(o),2)}</b> · dal 2015: ⌀ <b>${fmt(avg(n),2)}</b>.`); }
  const dmap={}; L.forEach(f=>{ if(f.d) (dmap[f.d] ||= []).push(f); });
  const dr=Object.entries(dmap).filter(([,s])=>s.length>=4).map(([d,s])=>({d,n:s.length,a:avg(s)})).sort((x,y)=>y.a-x.a);
  if (dr.length) out.push(`Regista del cuore (almeno 4 film): <b>${esc(dr[0].d)}</b>, ⌀ ${fmt(dr[0].a,2)} su ${dr[0].n}${dr[1]?`; poi ${esc(dr[1].d)} (⌀ ${fmt(dr[1].a,2)})`:""}.`);
  const sd=Math.sqrt(L.reduce((s,f)=>s+(f.r-a)**2,0)/L.length);
  out.push(`Deviazione standard ${fmt(sd,2)}: ${L.filter(f=>f.r>=7&&f.r<=8).length} film su ${L.length} tra 7 e 8; dieci pieni <b>${L.filter(f=>f.r===10).length}</b>, insufficienze (≤ 5) <b>${L.filter(f=>f.r<=5).length}</b>.`);
  return out.map(x=>`<li>${x}</li>`).join("");
}
